# ============================================
# MCP Pin Maintenance - mcp:update-pins
# ============================================
# Purpose: Monthly refresh of pinned MCP package versions across the three
# harness configs (.mcp.json, opencode.jsonc, .codex/config.toml) and the
# cross-harness compatibility contract, validated by agents:compat:check.
#
# Why pins instead of @latest: bunx resolves @latest against the npm registry
# on every launch; a slow resolution exceeds the ~30s agent startup window and
# the server is marked disabled (see scripts/update-mcp-pins.ts header).
#
# Manual trigger: Actions tab -> "MCP Pin Updates" -> Run workflow.

name: MCP Pin Updates
run-name: ${{ github.actor }} triggered MCP Pin Updates

on:
  schedule:
    - cron: '0 6 1 * *' # first day of every month, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  UpdatePins:
    name: Refresh MCP version pins
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Husky's pre-push runs full-repo gates whose state is environment-dependent
    # (e.g. skills REGISTRY.md staleness differs between OS checkouts). This
    # workflow validates exactly what it ships via its own explicit steps
    # (agents:compat repair + mcp:update-pins internal agents:compat:check).
    env:
      HUSKY: 0

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Match the local dev version: newer Bun rewrites bun.lock and
          # `--frozen-lockfile` then fails ("lockfile had changes").
          bun-version: 1.3.13

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # A fresh checkout has no .claude/skills alias (generated locally by the
      # installer), so agents:compat:check would refuse. Repair first.
      - name: Repair Harness Compatibility
        run: bun run agents:compat

      - name: Refresh Pins
        run: bun run mcp:update-pins

      - name: Open update PR when pins changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PIN_PATHS=".mcp.json opencode.jsonc .codex/config.toml scripts/agent-compatibility-contracts.ts"
          if git diff --quiet -- $PIN_PATHS; then
            echo "Pins already current — no PR needed."
            exit 0
          fi

          BRANCH="chore/mcp-pin-updates-$(date +%Y-%m)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --stat -- $PIN_PATHS
          git checkout -b "$BRANCH"
          git add $PIN_PATHS
          git commit -m "chore(mcp): refresh pinned MCP versions

          Automated monthly refresh by bun run mcp:update-pins.
          Cross-harness contract gate (agents:compat:check) passed in CI."
          git push -u origin "$BRANCH"

          {
            echo "## Automated MCP pin updates"
            echo ""
            echo '```'
            git diff HEAD~1 --stat -- $PIN_PATHS
            echo '```'
            echo ""
            echo "Generated by \`bun run mcp:update-pins\` — review the diff, then merge to apply."
          } > pr-body.md
          gh pr create \
            --title "chore(mcp): refresh pinned MCP versions ($(date +%Y-%m))" \
            --body-file pr-body.md \
            --base main \
            --head "$BRANCH"
